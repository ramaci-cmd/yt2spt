[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2sp"
version = "1.3.0"
description = "Port YouTube Music playlists to Spotify with zero API costs & high precision"
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.12",
    "spotifyscraper>=3.9",
    "rapidfuzz>=3",
    "unidecode>=1.3",
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
]

[project.scripts]
yt2sp = "yt2sp.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["yt2sp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
